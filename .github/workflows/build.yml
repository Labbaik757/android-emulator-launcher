name: Build Windows exe

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build exe
        run: pyinstaller --onefile --windowed --name AndroidEmulatorLauncher main.py

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AndroidEmulatorLauncher.exe
